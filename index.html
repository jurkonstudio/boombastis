.c1 i{background:linear-gradient(#58adff,#0a6cff)}.c2 i{background:linear-gradient(#69e08a,#1fa64a)}.c3 i{background:linear-gradient(#ffc04d,#ff8a00)}.c4 i{background:linear-gradient(#c692ff,#8a4cf0)}.c5 i{background:linear-gradient(#55d6e8,#0b9fc0)}.c6 i{background:linear-gradient(#ff8796,#f0405a)}

.chips button{flex:none;min-height:34px;padding:0 14px;border-radius:99px;background:var(--f);color:var(--t);font-weight:500;font-size:14px;filter:none}.chips .on{background:var(--p);color:#fff}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;font-size:17px}details.card>summary::-webkit-details-marker{display:none}

details.card[open]>summary{margin-bottom:6px}
.tp .row button{min-height:36px;padding:0 14px;font-size:14px}.tp .acts{display:flex;gap:6px;justify-content:flex-end}

</style></head><body><main>
<div id="msg"></div><div id="root"></div></main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const C = window.CFG || {};
if (!window.supabase || !C.key || C.key.startsWith('ISI-')) {
  document.getElementById('root').textContent = !window.supabase
    ? 'Gagal memuat pustaka Supabase (cek internet / buka lewat https).'
    : 'Anon key belum diisi di config.js.';
  throw new Error('config');
}
const sb = window.supabase.createClient(C.url, C.key);
const $ = s => document.querySelector(s), root = $('#root');
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');
const wk = d => d ? new Date(d).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}) : '-';
function h(tag, a = {}, ...kids){const e=document.createElement(tag);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e[k]=a[k];}
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c==null?'':c)));return e;}
const TR=[[/invalid login/i,'Email atau password salah.'],[/already (been )?registered/i,'Email sudah terdaftar. Coba masuk.'],[/not confirmed/i,'Email belum dikonfirmasi. Cek kotak masuk atau folder spam.'],[/rate limit|too many/i,'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.'],[/failed to fetch|network/i,'Tidak ada koneksi internet.']];
const tr=m=>(TR.find(([r])=>r.test(m))||[0,m])[1];
function say(t,bad){const m=$('#msg');m.replaceChildren(h('div',{class:'al '+(bad?'er':'ok'),role:bad?'alert':'status'},bad?tr(String(t)):t));clearTimeout(say.t);say.t=setTimeout(()=>m.replaceChildren(),bad?8000:4000);}
const cfg=async()=>Object.fromEntries(((await sb.from('site_settings').select('key,value')).data||[]).map(x=>[x.key,x.value]));
const cp=t=>navigator.clipboard.writeText(t).then(()=>say('Disalin.')).catch(()=>say('Salin manual: '+t));
const seg=(o,cur,fn)=>h('div',{class:'seg'},...o.map(([k,l])=>h('button',{class:k===cur?'on':'',onclick:()=>fn(k)},l)));
const goTab=k=>{tab=k;shell();scrollTo(0,0);};
async function run(btn, fn){if(btn)btn.disabled=true;try{await fn();}catch(e){say(e.message||String(e),true);}finally{if(btn)btn.disabled=false;}}
let user=null, acc=null, tab='home';

function authView(){clearInterval(timer);
  let mode='in';const wrap=h('div',{class:'auth'});
  root.replaceChildren(h('header',{class:'top'},brand()),wrap);
  const draw=()=>{
    const up=mode==='up',fld=(l,a)=>{const i=h('input',a);return[h('label',{class:'lb'},l,i),i];};
    const[nl,nm]=fld('Nama',{autocomplete:'name'}),[wl,wa]=fld('Nomor WhatsApp',{type:'tel',autocomplete:'tel',placeholder:'081234567890'}),
      [el,em]=fld('Email',{type:'email',autocomplete:'email'}),[pl,pw]=fld(up?'Password (minimal 8 karakter)':'Password',{type:'password',autocomplete:up?'new-password':'current-password'});
    const tc=h('input',{type:'checkbox'});
    const go=h('button',{class:'wide',onclick:()=>run(go,async()=>{
      if(!em.value.trim()||!pw.value)throw new Error('Isi email dan password.');
      if(!up){const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)throw error;return start();}
      if(!nm.value.trim())throw new Error('Isi namamu.');
      if(pw.value.length<8)throw new Error('Password minimal 8 karakter.');
      if(!tc.checked)throw new Error('Centang persetujuan aturan pemakaian.');
      const{data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{full_name:nm.value.trim(),phone:wa.value.trim(),accepted_terms:'true'}}});
      if(error)throw error;if(data.session)return start();
      wrap.replaceChildren(h('div',{class:'card'},h('h2',{},'Cek email-mu'),h('p',{},'Kami mengirim tautan konfirmasi ke '+em.value.trim()+'. Buka tautannya (cek folder spam bila belum ada), lalu masuk di sini.'),h('button',{class:'wide',onclick:()=>{mode='in';draw();}},'Ke halaman masuk')));
    })},up?'Buat akun':'Masuk');
    pw.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
    wrap.replaceChildren(h('div',{class:'hero0'},h('i',{},logo())),h('h1',{},up?'Buat akun':'Masuk'),h('p',{class:'m'},up?'Daftar dulu, pilih paket setelah masuk.':'Kirim SMS lewat HP dan SIM milikmu sendiri.'),
      seg([['in','Masuk'],['up','Daftar']],mode,k=>{mode=k;draw();}),
      h('div',{class:'card'},...(up?[nl,wl]:[]),el,pl,...(up?[h('label',{class:'chk'},tc,h('span',{},'Saya setuju dengan ',h('a',{href:'../terms.html',target:'_blank'},'Syarat Layanan'),' dan ',h('a',{href:'../privacy.html',target:'_blank'},'Kebijakan Privasi'),', serta tidak memakai layanan ini untuk spam, penipuan, atau pesan tanpa izin penerima.'))]:[]),go));
  };draw();
}

async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  user=session.user;
  const{data,error}=await sb.rpc('my_account');
  if(error){say(error.message,true);return authView();}
  acc=data;shell();
}
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',send:'<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',msgs:'<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',dev:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',auto:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',api:'<path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/>',plan:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/>',more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'};
const ico=k=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=IC[k];return s;};
const logo=(c)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML='<path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-5l-5 4v-4H7a3 3 0 0 1-3-3z"/>';return s;};
const brand=()=>h('span',{class:'brand'},h('i',{},logo()),h('b',{},'Boombastis'));
const MORE=['more','auto','nomor','api','plan','help','admin'],TT={auto:'Balasan otomatis',nomor:'Nomor masuk',api:'API & integrasi',plan:'Paket & pembayaran',help:'Panduan penggunaan',admin:'Admin'};
let timer=null;
function shell(){
  clearInterval(timer);
  const T=[['home','Beranda'],['send','Kirim'],['msgs','Pesan'],['dev','Perangkat'],['more','Lainnya']],sub=MORE.includes(tab)&&tab!=='more',cur=MORE.includes(tab)?'more':tab,
    body=h('div');
  if(['home','auto','admin'].includes(tab))body.append(h('div',{class:'sk'}),h('div',{class:'sk'}));
  root.replaceChildren(h('header',{class:'top'},sub?h('button',{class:'lnk',onclick:()=>goTab('more')},'‹ Lainnya'):brand(),sub?h('b',{},TT[tab]):''),body,
    h('nav',{class:'tabs'},...T.map(([k,l])=>h('button',{class:cur===k?'on':'',onclick:()=>goTab(k)},ico(k),l))));
  if(acc.profile?.is_suspended)body.append(h('div',{class:'card er'},'Akunmu ditangguhkan. Hubungi admin.'));
  Promise.resolve(({home,send,msgs,auto,nomor,dev,plan,admin,more,api,help})[tab](body)).catch(e=>say(e.message,true)).finally(()=>body.querySelectorAll('.sk').forEach(e=>e.remove()));
}
function more(b){
  const row=(t,s,k)=>h('button',{class:'mi',onclick:()=>goTab(k)},h('span',{},t,h('small',{},s)),'›');
  b.append(h('h1',{},'Lainnya'),row('Balasan otomatis','Balas SMS masuk berdasarkan kata kunci','auto'),row('Nomor masuk','Daftar pengirim SMS, siap disalin','nomor'),row('API & integrasi','Kirim SMS dari website atau aplikasimu','api'),
    row('Paket & pembayaran',acc.subscription?'Paket '+acc.subscription.plan_name:'Pilih atau perpanjang paket','plan'),row('Panduan penggunaan','Langkah demi langkah, template, dan solusi masalah','help'),
    ...(acc.is_admin?[row('Admin','Pembayaran, pelanggan, pengaturan situs','admin')]:[]),
    h('p',{class:'m'},user.email||''),h('button',{class:'g wide',onclick:async()=>{await sb.auth.signOut();authView();}},'Keluar'));
}
async function refresh(){const{data}=await sb.rpc('my_account');if(data)acc=data;}

async function nomor(b){
  const{data,error}=await sb.from('sender_directory').select('from_number,first_seen,last_seen,total').eq('owner_id',user.id).order('last_seen',{ascending:false}).limit(2000);
  if(error)throw error;
  let rng='7';
  const draw=()=>{
    const days=Number(rng),cutoff=Date.now()-days*86400000;
    const rows=(data||[]).filter(r=>!days||new Date(r.first_seen).getTime()>=cutoff);
    const nums=rows.map(r=>r.from_number);
    const cell=(t)=>h('td',{style:'padding:8px 6px;border-bottom:1px solid var(--ln,#e5e7eb);font-size:13px;white-space:nowrap'},t);
    b.replaceChildren(
      h('h1',{},'Nomor masuk'),
      h('p',{class:'m'},'Nomor pengirim SMS yang masuk ke HP-mu. Pilih periode, lalu salin.'),
      seg([['1','Hari ini'],['7','7 hari'],['30','30 hari'],['0','Semua']],rng,k=>{rng=k;draw();}),
      h('div',{class:'card'},
        h('p',{class:'m'},rows.length+' nomor'),

    const sv=h('button',{class:'wide',onclick:()=>run(sv,async()=>{const{error}=await sb.from('site_settings').upsert(keys.map(([k],i)=>({key:k,value:ins[i].value.trim(),updated_at:new Date().toISOString()})));if(error)throw error;say('Pengaturan situs disimpan.');})},'Simpan');
    box.replaceChildren(h('div',{class:'card'},h('h2',{},'Pengaturan situs'),...keys.flatMap(([k,l],i)=>[h('label',{class:'lb'},l,ins[i])]),sv),
      h('div',{class:'card'},h('h2',{},'Harga paket'),h('p',{class:'m'},'Ubah lewat SQL Editor Supabase, lalu muat ulang halaman:'),h('pre',{class:'cd'},"update plans set price_idr = 149000\nwhere name = 'Pro';")));
  };
  const load=async()=>{
    const[{data:ov,error:e1},{data:pm},{data:ss},{data:ps},{data:tp}]=await Promise.all([sb.rpc('admin_overview'),sb.from('payments').select('*').eq('status','pending').order('created_at'),sb.from('site_settings').select('*'),sb.from('plans').select('id,name').order('sort_order'),sb.from('message_templates').select('*').is('owner_id',null).order('sort_order').order('created_at')]);
    if(e1)return say(e1.message,true);
    D={ov,pm:pm||[],ps:ps||[],tp:tp||[],set:Object.fromEntries((ss||[]).map(x=>[x.key,x.value])),who:Object.fromEntries(ov.map(u=>[u.user_id,u]))};view();
  };
  await load();
}

function dev(b){
  const how=h('div',{class:'card'}),box=h('div');
  const nm=h('input',{placeholder:'Contoh: HP Toko'}),
    add=h('button',{class:'wide',onclick:()=>run(add,async()=>{const{error}=await sb.rpc('create_device',{p_name:nm.value.trim()||'HP gateway'});if(error)throw error;nm.value='';say('Perangkat dibuat. Masukkan kodenya di aplikasi HP.');await refresh();draw();})},'Tambah perangkat');
  b.append(h('h1',{},'Perangkat'),how,box,h('div',{class:'card'},h('h2',{},'Tambah HP baru'),h('label',{class:'lb'},'Nama perangkat',nm),add));
  const draw=async()=>{
    const[{data,error},S]=await Promise.all([sb.from('devices').select('*').eq('owner_id',user.id).order('created_at'),cfg()]);
    if(error)return say(error.message,true);
    const on=d=>d.last_seen_at&&Date.now()-new Date(d.last_seen_at)<3*6e4,ok=/^https:\/\//.test(S.apk_url||'');
    how.replaceChildren(h('h2',{},'Cara memasang'),h('ol',{class:'pl'},h('li',{},'Unduh dan pasang aplikasi di HP Android.'),h('li',{},'Buka aplikasi, izinkan SMS dan pengecualian baterai.'),h('li',{},'Masukkan kode pairing dari perangkat di bawah (berlaku 15 menit).')),
      ok?h('a',{href:S.apk_url,rel:'noopener'},h('button',{class:'wide'},'Unduh aplikasi'+(S.apk_version?' (v'+S.apk_version+')':''))):h('p',{class:'warn'},'Link aplikasi belum tersedia.'+(S.support_contact?' Hubungi '+S.support_contact+'.':'')));
    box.replaceChildren(...(data.length?data.map(d=>{const v=d.pair_code&&d.pair_expires_at&&new Date(d.pair_expires_at)>new Date();
      return h('div',{class:'card'},h('div',{class:'row0'},h('b',{},d.name),h('span',{class:'bd '+(on(d)?'ok':'')},on(d)?'Online':d.last_seen_at?'Offline':'Belum terhubung')),
        d.last_seen_at?h('div',{class:'m'},'Terakhir terlihat '+wk(d.last_seen_at)):'',
        v?h('div',{class:'code'},h('span',{},d.pair_code),h('button',{class:'g',onclick:()=>cp(d.pair_code)},'Salin')):'',
        h('button',{class:'g wide',onclick:e=>run(e.target,async()=>{const{error}=await sb.rpc('new_pair_code',{p_device_id:d.id});if(error)throw error;draw();})},v?'Buat kode baru':'Buat kode pairing'));
    }):[h('p',{class:'m'},'Belum ada perangkat. Tambahkan HP pertamamu di bawah.')]));
  };draw();
}

function api(b){
  const U=C.url+'/rest/v1/rpc/',fresh=h('div'),list=h('div',{class:'card'}),ex=h('div',{class:'card'});
  const curl=k=>"curl -X POST '"+U+"api_send_sms' \\\n  -H 'apikey: "+C.key+"' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"p_key\":\""+k+"\",\"p_to\":\"081234567890\",\"p_message\":\"Halo dari Boombastis\"}'";
  const stc=k=>"curl -X POST '"+U+"api_sms_status' \\\n  -H 'apikey: "+C.key+"' \\\n  -H 'Content-Type: application/json' \\\n  -d '{\"p_key\":\""+k+"\",\"p_id\":\"ID-DARI-RESPONS-KIRIM\"}'";
  const show=k=>ex.replaceChildren(h('h2',{},'Contoh pemakaian'),h('p',{class:'m'},'Kirim SMS:'),h('pre',{class:'cd'},curl(k)),h('p',{class:'m'},'Cek status pesan:'),h('pre',{class:'cd'},stc(k)),
    h('button',{class:'g',onclick:()=>cp(curl(k))},'Salin contoh kirim'),h('p',{class:'warn bk'},'Panggil dari server milikmu. Jangan menaruh API key di kode yang bisa dilihat pengunjung.'));
  const nm=h('input',{placeholder:'Contoh: Website toko',maxLength:60});
  const mk=h('button',{class:'wide',onclick:()=>run(mk,async()=>{const{data,error}=await sb.rpc('create_api_key',{p_name:nm.value.trim()||'API key'});if(error)throw error;nm.value='';
    fresh.replaceChildren(h('section',{class:'card'},h('h2',{},'API key baru'),h('p',{class:'warn'},'Simpan sekarang. Key ini tidak akan ditampilkan lagi.'),h('div',{class:'code'},h('span',{style:'font-size:14px;letter-spacing:0;word-break:break-all'},data.key),h('button',{class:'g',onclick:()=>cp(data.key)},'Salin'))));show(data.key);draw();})},'Buat API key');
  const draw=async()=>{
    const{data,error}=await sb.from('api_keys').select('id,name,prefix,created_at,last_used_at,revoked_at').order('created_at',{ascending:false});
    if(error)return list.replaceChildren(h('h2',{},'API key'),h('p',{class:'er'},/api_keys/.test(error.message)?'Fitur API belum aktif: jalankan migrasi 20261101040000_api_keys.sql di Supabase.':error.message));
    list.replaceChildren(h('h2',{},'API key'),...(data.length?data.map(k=>h('div',{class:'row'},h('div',{class:'bx'},h('b',{},k.name),h('div',{class:'m'},k.prefix+'… · dibuat '+wk(k.created_at)),h('div',{class:'m'},k.revoked_at?'Dicabut':'Terakhir dipakai '+wk(k.last_used_at))),
      k.revoked_at?h('span',{class:'bd'},'Dicabut'):h('button',{class:'g',onclick:e=>run(e.target,async()=>{if(!confirm('Cabut key "'+k.name+'"? Sistem yang memakainya akan berhenti bisa mengirim.'))return;const{error}=await sb.rpc('revoke_api_key',{p_id:k.id});if(error)throw error;draw();})},'Cabut'))):[h('p',{class:'m'},'Belum ada API key.')]));
  };
  b.append(h('p',{class:'m'},'Kirim SMS dari website atau aplikasimu lewat HTTP. SMS tetap keluar dari HP gateway-mu dan memakai kuota paket. Maksimal 5 key aktif.'),fresh,
    h('div',{class:'card'},h('label',{class:'lb'},'Nama key',nm),mk),list,ex);
  show('API_KEY_KAMU');draw();
}

function plan(b){
  const top=h('div'),pl=h('div'),hist=h('div',{class:'card'});b.append(h('h1',{},'Paket'),top,pl,hist);
  const draw=async()=>{
    const[{data:ps},{data:pm},S]=await Promise.all([sb.from('plans').select('*').eq('is_active',true).order('sort_order'),
      sb.from('payments').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(10),cfg()]);
    const pend=(pm||[]).find(x=>x.status==='pending');
    top.replaceChildren(...(pend?[h('section',{class:'card'},h('h2',{},'Selesaikan pembayaran'),h('p',{class:'m'},pend.plan_name+' · transfer sesuai jumlah ini:'),
      h('div',{class:'amt'},h('span',{},rp(pend.amount_idr)),h('button',{class:'g',onclick:()=>cp(String(pend.amount_idr))},'Salin')),
      h('p',{class:'ins'},S.payment_instructions||'Hubungi admin untuk nomor rekening.'),
      h('p',{class:'m'},'Nominal sudah termasuk kode unik agar transfermu mudah dikenali. Paket aktif setelah admin memastikan transfer masuk.'+(S.support_contact?' Bantuan: '+S.support_contact:'')))]:[]));
    pl.replaceChildren(...(ps||[]).map(p=>h('section',{class:'card'},h('h2',{},p.name),h('div',{class:'price'},rp(p.price_idr)),h('p',{class:'m'},p.description||''),
      h('ul',{class:'pl'},h('li',{},p.sms_quota+' SMS'),h('li',{},'Aktif '+p.duration_days+' hari'),h('li',{},p.max_devices+' perangkat · maks. '+p.daily_limit+' SMS per hari')),
      h('button',{class:'wide',onclick:e=>run(e.target,async()=>{const{error}=await sb.rpc('create_order',{p_plan_id:p.id});if(error)throw error;say('Pesanan dibuat. Ikuti petunjuk transfer di atas.');await draw();scrollTo(0,0);})},'Pesan paket'))));
    const L={pending:['Menunggu konfirmasi','m'],paid:['Lunas','ok'],rejected:['Ditolak','er']};
    hist.replaceChildren(h('h2',{},'Riwayat pesanan'),...(pm?.length?pm.map(x=>h('div',{class:'row'},h('div',{},h('b',{},x.plan_name),h('div',{class:'m'},wk(x.created_at))),
      h('div',{class:'rt'},rp(x.amount_idr),h('div',{class:'m '+(L[x.status]||['',''])[1]},(L[x.status]||[x.status])[0])))):[h('p',{class:'m'},'Belum ada pesanan.')]));
  };
  draw().catch(e=>say(e.message,true));
}

name: Build SMS Gateway APK

on:
  push:
    branches: [main]
    paths:
      - 'sms-gateway/android/**'
      - '.github/workflows/build-sms-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: sms-gateway/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp sms-gateway/android/app/build/outputs/apk/debug/app-debug.apk sms-gateway-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sms-gateway-debug-apk
          path: sms-gateway-debug.apk

      - name: Rilis APK (unduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest sms-gateway-debug.apk \
            --title "SMS Gateway APK (build ${{ github.run_number }})" \
            --notes "APK debug otomatis dari commit ${{ github.sha }}." \
            --prerelease

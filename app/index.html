<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boombastis · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--c:#fff;--t:#101828;--m:#5b6475;--p:#2457f5;--ok:#12804a;--er:#c62828;--wn:#a15c07;--b:#e3e7ee;--soft:#eef2ff}
@media(prefers-color-scheme:dark){:root{--bg:#0d111a;--c:#151b27;--t:#e9edf5;--m:#9aa4b8;--p:#3d68f2;--ok:#4cc38a;--er:#ff8a8a;--wn:#f0b25e;--b:#252e40;--soft:#1a2340}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:640px;margin:0 auto;padding:0 16px 96px}
h1{font-size:24px;font-weight:800;line-height:1.2;margin:20px 0 12px}h2{font-size:17px;font-weight:800;margin:0 0 8px}p{margin:0 0 10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin:0 0 14px}
input,textarea,select{display:block;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;margin:6px 0 10px}
input[type=checkbox]{display:inline-block;width:20px;height:20px;min-height:0;margin:2px 0 0;flex:none}
button{font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--p);background:var(--p);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--p);border-color:var(--b)}button.lnk{background:none;border:0;color:var(--m);min-height:40px;padding:0 10px}button.lnk.on{color:var(--p)}
button.wide{width:100%}button:disabled{opacity:.5}:focus-visible{outline:3px solid color-mix(in srgb,var(--p) 55%,transparent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;margin:0 -16px;padding:calc(6px + env(safe-area-inset-top)) 16px 6px;background:var(--c);border-bottom:1px solid var(--b)}
.top b{font-weight:800;font-size:18px}.tl{display:flex}
.tabs{position:fixed;inset:auto 0 0;z-index:5;display:flex;background:var(--c);border-top:1px solid var(--b);padding:0 max(0px,calc((100vw - 640px)/2)) env(safe-area-inset-bottom)}
.tabs button{flex:1;min-height:58px;padding:0;border:0;border-radius:0;background:none;color:var(--m);font-size:12.5px;box-shadow:inset 0 3px 0 transparent}.tabs .on{color:var(--p);box-shadow:inset 0 3px 0 var(--p)}
#msg{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;max-width:616px;margin:auto;z-index:20}
.al{padding:12px 14px;border-radius:12px;background:var(--c);border:1px solid var(--b);box-shadow:0 8px 24px -10px rgba(0,0,0,.35);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--b)}.row:first-child{border:0}.row0{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m{color:var(--m);font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}.big{font-size:34px;font-weight:800;line-height:1.1}.bx{min-width:0;overflow-wrap:anywhere}.rt{flex:none;text-align:right}
.bar{height:10px;background:var(--b);border-radius:5px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--p)}
.seg{display:flex;background:var(--soft);padding:4px;border-radius:12px;margin:0 0 14px}.seg button{flex:1;min-height:38px;border:0;background:none;color:var(--m)}.seg .on{background:var(--c);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lb{display:block;font-weight:600;font-size:14px;margin:0 0 6px}.chk{display:flex;gap:10px;margin:0 0 14px;font-size:14px;color:var(--m)}.auth{max-width:420px;margin:0 auto}
.bd{padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--m)}.bd.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)}.bd.er{background:color-mix(in srgb,var(--er) 15%,transparent)}
.st{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--b)}.st:first-of-type{border:0}.st i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;border:1.5px solid var(--b);color:var(--m)}
.st.done i{background:var(--ok);border-color:var(--ok);color:var(--bg)}.st.done b{color:var(--m)}.st.now i{background:var(--p);border-color:var(--p);color:#fff}.st p{margin:2px 0 10px;color:var(--m);font-size:14.5px}
.code,.amt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:12px 14px;background:var(--soft);border-radius:12px}.code span,.amt span{font-size:28px;font-weight:800;letter-spacing:.06em}.code span{letter-spacing:.18em}
.ins{white-space:pre-line;padding:12px 14px;border:1px dashed var(--b);border-radius:12px}.warn{color:var(--wn);font-weight:600}.price{font-size:26px;font-weight:800;margin:0 0 6px}.pl{margin:8px 0 14px;padding-left:20px;color:var(--m)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<div id="msg"></div><div id="root"></div></main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const C = window.CFG || {};
if (!window.supabase || !C.key || C.key.startsWith('ISI-')) {
  document.getElementById('root').textContent = !window.supabase
    ? 'Gagal memuat pustaka Supabase (cek internet / buka lewat https).'
    : 'Anon key belum diisi di config.js.';
  throw new Error('config');
}
const sb = window.supabase.createClient(C.url, C.key);
const $ = s => document.querySelector(s), root = $('#root');
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');
const wk = d => d ? new Date(d).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}) : '-';
function h(tag, a = {}, ...kids){const e=document.createElement(tag);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e[k]=a[k];}
  kids.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c==null?'':c)));return e;}
const TR=[[/invalid login/i,'Email atau password salah.'],[/already (been )?registered/i,'Email sudah terdaftar. Coba masuk.'],[/not confirmed/i,'Email belum dikonfirmasi. Cek kotak masuk atau folder spam.'],[/rate limit|too many/i,'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.'],[/failed to fetch|network/i,'Tidak ada koneksi internet.']];
const tr=m=>(TR.find(([r])=>r.test(m))||[0,m])[1];
function say(t,bad){const m=$('#msg');m.replaceChildren(h('div',{class:'al '+(bad?'er':'ok'),role:bad?'alert':'status'},bad?tr(String(t)):t));clearTimeout(say.t);if(!bad)say.t=setTimeout(()=>m.replaceChildren(),4000);}
const cfg=async()=>Object.fromEntries(((await sb.from('site_settings').select('key,value')).data||[]).map(x=>[x.key,x.value]));
const cp=t=>navigator.clipboard.writeText(t).then(()=>say('Disalin.')).catch(()=>say('Salin manual: '+t));
const seg=(o,cur,fn)=>h('div',{class:'seg'},...o.map(([k,l])=>h('button',{class:k===cur?'on':'',onclick:()=>fn(k)},l)));
const goTab=k=>{tab=k;shell();scrollTo(0,0);};
async function run(btn, fn){if(btn)btn.disabled=true;try{await fn();}catch(e){say(e.message||String(e),true);}finally{if(btn)btn.disabled=false;}}
let user=null, acc=null, tab='home';

function authView(){
  let mode='in';const wrap=h('div',{class:'auth'});
  root.replaceChildren(h('header',{class:'top'},h('b',{},'Boombastis')),wrap);
  const draw=()=>{
    const up=mode==='up',fld=(l,a)=>{const i=h('input',a);return[h('label',{class:'lb'},l,i),i];};
    const[nl,nm]=fld('Nama',{autocomplete:'name'}),[wl,wa]=fld('Nomor WhatsApp',{type:'tel',autocomplete:'tel',placeholder:'081234567890'}),
      [el,em]=fld('Email',{type:'email',autocomplete:'email'}),[pl,pw]=fld(up?'Password (minimal 8 karakter)':'Password',{type:'password',autocomplete:up?'new-password':'current-password'});
    const tc=h('input',{type:'checkbox'});
    const go=h('button',{class:'wide',onclick:()=>run(go,async()=>{
      if(!em.value.trim()||!pw.value)throw new Error('Isi email dan password.');
      if(!up){const{error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)throw error;return start();}
      if(!nm.value.trim())throw new Error('Isi namamu.');
      if(pw.value.length<8)throw new Error('Password minimal 8 karakter.');
      if(!tc.checked)throw new Error('Centang persetujuan aturan pemakaian.');
      const{data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{full_name:nm.value.trim(),phone:wa.value.trim(),accepted_terms:'true'}}});
      if(error)throw error;if(data.session)return start();
      wrap.replaceChildren(h('div',{class:'card'},h('h2',{},'Cek email-mu'),h('p',{},'Kami mengirim tautan konfirmasi ke '+em.value.trim()+'. Buka tautannya (cek folder spam bila belum ada), lalu masuk di sini.'),h('button',{class:'wide',onclick:()=>{mode='in';draw();}},'Ke halaman masuk')));
    })},up?'Buat akun':'Masuk');
    pw.addEventListener('keydown',e=>{if(e.key==='Enter')go.click();});
    wrap.replaceChildren(h('h1',{},up?'Buat akun':'Masuk'),h('p',{class:'m'},up?'Daftar dulu, pilih paket setelah masuk.':'Kirim SMS lewat HP dan SIM milikmu sendiri.'),
      seg([['in','Masuk'],['up','Daftar']],mode,k=>{mode=k;draw();}),
      h('div',{class:'card'},...(up?[nl,wl]:[]),el,pl,...(up?[h('label',{class:'chk'},tc,h('span',{},'Saya setuju: layanan ini tidak dipakai untuk spam, penipuan, atau pesan tanpa izin penerima. Akun yang melanggar bisa ditangguhkan.'))]:[]),go));
  };draw();
}

async function start(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  user=session.user;
  const{data,error}=await sb.rpc('my_account');
  if(error){say(error.message,true);return authView();}
  acc=data;shell();
}
function shell(){
  const T=[['home','Beranda'],['send','Kirim'],['msgs','Pesan'],['auto','Balasan'],['dev','Perangkat']],body=h('div');
  root.replaceChildren(h('header',{class:'top'},h('b',{},'Boombastis'),h('div',{class:'tl'},
    h('button',{class:'lnk'+(tab==='plan'?' on':''),onclick:()=>goTab('plan')},'Paket'),
    ...(acc.is_admin?[h('button',{class:'lnk'+(tab==='admin'?' on':''),onclick:()=>goTab('admin')},'Admin')]:[]),
    h('button',{class:'lnk',onclick:async()=>{await sb.auth.signOut();authView();}},'Keluar'))),body,
    h('nav',{class:'tabs'},...T.map(([k,l])=>h('button',{class:tab===k?'on':'',onclick:()=>goTab(k)},l))));
  if(acc.profile?.is_suspended)body.append(h('div',{class:'card er'},'Akunmu ditangguhkan. Hubungi admin.'));
  Promise.resolve(({home,send,msgs,auto,dev,plan,admin})[tab](body)).catch(e=>say(e.message,true));
}
async function refresh(){const{data}=await sb.rpc('my_account');if(data)acc=data;}

async function home(b){
  const s=acc.subscription,nm=(acc.profile?.full_name||'').split(' ')[0];
  const[{data:dv},{count:n}]=await Promise.all([sb.from('devices').select('last_seen_at').eq('owner_id',user.id),sb.from('outbox').select('id',{count:'exact',head:true}).eq('owner_id',user.id)]);
  b.append(h('h1',{},'Halo'+(nm?', '+nm:'')));
  const d=[!!(s||acc.is_admin),(dv||[]).some(x=>x.last_seen_at),n>0],cur=d.indexOf(false);
  if(cur>-1){const S=[['Pilih paket','Pilih jumlah SMS yang kamu butuhkan, lalu transfer.','Lihat paket','plan'],['Pasang aplikasi di HP Android','HP dan SIM-mu yang akan mengirim SMS. Unduh aplikasi, lalu masukkan kode pairing.','Siapkan HP','dev'],['Kirim SMS pertama','Coba kirim ke nomormu sendiri.','Tulis pesan','send']];
    b.append(h('section',{class:'card'},h('h2',{},'Mulai dari sini'),...S.map(([t,x,l,k],i)=>h('div',{class:'st'+(d[i]?' done':i===cur?' now':'')},h('i',{},d[i]?'✓':i+1),
      h('div',{},h('b',{},t),i===cur?[h('p',{},x),h('button',{onclick:()=>goTab(k)},l)]:'')))));}
  if(!s)return;
  const left=s.sms_quota-s.sms_used,pct=Math.min(100,s.sms_used/s.sms_quota*100),low=left<=Math.max(5,s.sms_quota*.1)||new Date(s.expires_at)-Date.now()<3*864e5;
  b.append(h('section',{class:'card'},h('div',{class:'m'},'Paket '+s.plan_name),h('div',{class:'big'},left+' SMS'),h('div',{class:'m'},'tersisa dari '+s.sms_quota),h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),
    h('p',{class:s.active?'m':'er'},(s.active?'Aktif sampai ':'Berakhir pada ')+wk(s.expires_at)),
    low?h('p',{class:'warn'},'Kuota atau masa aktif hampir habis. ',h('button',{class:'g',onclick:()=>goTab('plan')},'Perpanjang')):'',
    h('div',{class:'m'},'Perangkat: '+acc.devices+' dari '+s.max_devices+' · Batas harian: '+s.daily_limit+' SMS')));
}

function send(b){
  const live=acc.is_admin||acc.subscription?.active;b.append(h('h1',{},'Kirim SMS'));
  if(!live)b.append(h('div',{class:'card'},h('h2',{},'Paket belum aktif'),h('p',{class:'m'},'Kamu perlu paket aktif untuk mengirim SMS.'),h('button',{onclick:()=>goTab('plan')},'Lihat paket')));
  const to=h('input',{type:'tel',placeholder:'081234567890',autocomplete:'off'}),tx=h('textarea',{rows:5,maxLength:1000}),cnt=h('div',{class:'m'},'0/1000');tx.oninput=()=>cnt.textContent=tx.value.length+'/1000';
  const go=h('button',{class:'wide',disabled:!live,onclick:()=>run(go,async()=>{
    if(!to.value.trim()||!tx.value.trim())throw new Error('Isi nomor tujuan dan pesan.');
    const{error}=await sb.from('outbox').insert({to_number:to.value.trim(),body:tx.value.trim(),owner_id:user.id});if(error)throw error;
    say('Pesan masuk antrean. HP akan mengirimnya sebentar lagi.');to.value=tx.value='';cnt.textContent='0/1000';await refresh();
  })},'Kirim SMS');
  b.append(h('div',{class:'card'},h('label',{class:'lb'},'Nomor tujuan',to),h('label',{class:'lb'},'Isi pesan',tx),cnt,h('p'),go,h('p',{class:'m'},'Dikirim lewat HP gateway-mu. Pesan yang gagal mengembalikan kuota.')));
}

function msgs(b){
  let w='outbox';const box=h('div',{class:'card'}),bar=h('div');b.append(h('h1',{},'Pesan'),bar,box);
  const ST={pending:['Menunggu',''],sending:['Mengirim',''],sent:['Terkirim','ok'],failed:['Gagal','er'],cancelled:['Dibatalkan','']};
  const draw=async()=>{
    bar.replaceChildren(seg([['outbox','Keluar'],['inbox','Masuk']],w,k=>{w=k;draw();}));
    const out=w==='outbox',{data,error}=await sb.from(w).select('*').order(out?'created_at':'received_at',{ascending:false}).limit(50);
    if(error)return say(error.message,true);
    box.replaceChildren(...(data.length?data.map(r=>{const s=ST[r.status]||[r.status,''];
      return h('div',{class:'row'},h('div',{class:'bx'},h('b',{},out?r.to_number:r.from_number),h('div',{},r.body),out&&r.status==='failed'&&r.error?h('div',{class:'m er'},r.error):''),
        h('div',{class:'rt'},out?h('span',{class:'bd '+s[1]},s[0]):'',h('div',{class:'m'},wk(out?r.created_at:r.received_at))));
    }):[h('p',{class:'m'},out?'Belum ada SMS keluar. Kirim yang pertama dari menu Kirim.':'Belum ada SMS masuk. SMS yang diterima HP gateway muncul di sini.')]));
  };draw();
}

async function auto(b){
  let{data:st}=await sb.from('auto_reply_settings').select('*').eq('owner_id',user.id).maybeSingle();
  if(!st){const r=await sb.from('auto_reply_settings').insert({owner_id:user.id}).select().single();if(r.error)throw r.error;st=r.data;}
  const en=h('input',{type:'checkbox',checked:st.enabled,style:'width:auto;margin-right:8px'}),
    cd=h('input',{type:'number',min:0,value:st.cooldown_minutes}),cp=h('input',{type:'number',min:1,value:st.daily_cap});
  const sv=h('button',{onclick:()=>run(sv,async()=>{const{error}=await sb.from('auto_reply_settings').update({enabled:en.checked,cooldown_minutes:+cd.value,daily_cap:+cp.value}).eq('owner_id',user.id);if(error)throw error;say('Pengaturan disimpan.');})},'Simpan');
  const box=h('div',{class:'card'});
  const draw=async()=>{
    const{data,error}=await sb.from('auto_reply_rules').select('*').order('priority').order('created_at');
    if(error)return say(error.message,true);
    box.replaceChildren(h('h2',{},'Aturan'),...(data.length?data.map(r=>h('div',{class:'row'},
      h('div',{},h('b',{},r.name),h('div',{class:'m'},({any:'Semua pesan',contains:'Mengandung',equals:'Sama persis',starts_with:'Diawali'})[r.match_type]+(r.keyword?': '+r.keyword:'')),h('div',{},r.reply_body)),
      h('div',{style:'flex:none;display:flex;flex-direction:column;gap:6px'},
        h('button',{class:'g',onclick:e=>run(e.target,async()=>{const{error}=await sb.from('auto_reply_rules').update({is_active:!r.is_active}).eq('id',r.id);if(error)throw error;draw();})},r.is_active?'Matikan':'Aktifkan'),
        h('button',{class:'g',onclick:e=>run(e.target,async()=>{if(!confirm('Hapus aturan ini?'))return;const{error}=await sb.from('auto_reply_rules').delete().eq('id',r.id);if(error)throw error;draw();})},'Hapus')))):[h('p',{class:'m'},'Belum ada aturan.')]));
  };
  const nm=h('input',{placeholder:'Nama aturan'}),mt=h('select',{},...[['any','Semua pesan'],['contains','Mengandung kata'],['equals','Sama persis'],['starts_with','Diawali kata']].map(([v,l])=>h('option',{value:v},l))),
    kw=h('input',{placeholder:'Kata kunci (kosongkan bila semua pesan)'}),rb=h('textarea',{rows:3,maxLength:1000,placeholder:'Isi balasan'}),pr=h('input',{type:'number',value:100});
  const ad=h('button',{onclick:()=>run(ad,async()=>{const{error}=await sb.from('auto_reply_rules').insert({name:nm.value.trim(),match_type:mt.value,keyword:kw.value.trim()||null,reply_body:rb.value.trim(),priority:+pr.value,owner_id:user.id});if(error)throw error;nm.value=kw.value=rb.value='';say('Aturan ditambah.');draw();})},'Tambah aturan');
  b.append(h('div',{class:'card'},h('h2',{},'Balasan otomatis'),h('label',{},en,'Aktif'),h('p',{class:'m'},'Jeda per pengirim (menit)'),cd,h('p',{class:'m'},'Batas balasan per hari'),cp,sv,
    h('p',{class:'m'},'Setiap balasan memakai kuota SMS. Aturan dengan angka prioritas terkecil dicek lebih dulu.')),box,
    h('div',{class:'card'},h('h2',{},'Aturan baru'),nm,mt,kw,rb,h('div',{class:'m'},'Prioritas'),pr,ad));
  draw();
}

async function admin(b){
  const box=h('div');b.append(box);
  const wa=p=>{let d=(p||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d?'https://wa.me/'+d:null;};
  const draw=async()=>{
    const[{data:ov,error:e1},{data:pm},{data:ss},{data:ps}]=await Promise.all([sb.rpc('admin_overview'),
      sb.from('payments').select('*').eq('status','pending').order('created_at'),
      sb.from('site_settings').select('*'),sb.from('plans').select('id,name').order('sort_order')]);
    if(e1)return say(e1.message,true);
    const who=Object.fromEntries(ov.map(u=>[u.user_id,u]));
    const set=Object.fromEntries((ss||[]).map(x=>[x.key,x.value]));
    const c1=h('div',{class:'card'},h('h2',{},'Pembayaran menunggu ('+(pm?.length||0)+')'),
      ...(pm?.length?pm.map(x=>{const u=who[x.owner_id]||{};const l=wa(u.phone);
        return h('div',{class:'row'},h('div',{},h('b',{},u.full_name||u.email||x.owner_id),h('div',{class:'m'},x.plan_name+' · '+wk(x.created_at)),
          l?h('a',{href:l,target:'_blank',rel:'noopener'},'WhatsApp '+u.phone):''),
          h('div',{style:'text-align:right;flex:none'},h('b',{},rp(x.amount_idr)),h('div',{style:'display:flex;gap:6px;margin-top:6px'},
            h('button',{onclick:e=>run(e.target,async()=>{if(!confirm('Konfirmasi '+rp(x.amount_idr)+' sudah masuk rekening?'))return;const{error}=await sb.rpc('admin_confirm_payment',{p_id:x.id});if(error)throw error;say('Langganan diaktifkan.');draw();})},'Konfirmasi'),
            h('button',{class:'g',onclick:e=>run(e.target,async()=>{const n=prompt('Alasan penolakan (opsional):');if(n===null)return;const{error}=await sb.rpc('admin_reject_payment',{p_id:x.id,p_note:n||null});if(error)throw error;draw();})},'Tolak'))));
      }):[h('p',{class:'m'},'Tidak ada pesanan menunggu.')]));
    const c2=h('div',{class:'card'},h('h2',{},'Pelanggan ('+ov.length+')'),...ov.map(u=>{const l=wa(u.phone);
      return h('div',{class:'row'},h('div',{},h('b',{},u.full_name||u.email),h('div',{class:'m'},u.email),l?h('a',{href:l,target:'_blank',rel:'noopener'},u.phone):'',
        h('div',{class:'m'},(u.plan_name?u.plan_name+' · '+u.sms_used+'/'+u.sms_quota+' · s/d '+wk(u.expires_at):'Belum berlangganan')),
        h('div',{class:'m'},u.device_count+' perangkat · terakhir online '+wk(u.last_seen_at)+' · '+u.sent_30d+' terkirim/30 hari'),
        u.is_suspended?h('div',{class:'er'},'Ditangguhkan'):''),
        h('div',{style:'flex:none;display:flex;flex-direction:column;gap:6px'},
          h('button',{class:'g',onclick:e=>run(e.target,async()=>{const i=prompt('Beri paket (tanpa bayar):\n'+ps.map((p,k)=>(k+1)+') '+p.name).join('\n'));const p=ps[(+i)-1];if(!p)return;const{error}=await sb.rpc('admin_grant_plan',{p_user:u.user_id,p_plan_id:p.id});if(error)throw error;say('Paket diberikan.');draw();})},'Beri paket'),
          h('button',{class:'g',onclick:e=>run(e.target,async()=>{const{error}=await sb.rpc('admin_set_suspended',{p_user:u.user_id,p_suspended:!u.is_suspended});if(error)throw error;draw();})},u.is_suspended?'Aktifkan':'Tangguhkan')));
    }));
    const keys=[['payment_instructions','Instruksi pembayaran (rekening)'],['apk_url','Link unduh APK'],['apk_version','Versi APK'],['support_contact','Kontak admin']];
    const ins=keys.map(([k])=>h('input',{value:set[k]||''}));
    const sv=h('button',{onclick:()=>run(sv,async()=>{const{error}=await sb.from('site_settings').upsert(keys.map(([k],i)=>({key:k,value:ins[i].value.trim(),updated_at:new Date().toISOString()})));if(error)throw error;say('Pengaturan situs disimpan.');})},'Simpan');
    const c3=h('div',{class:'card'},h('h2',{},'Pengaturan situs'),...keys.flatMap(([k,l],i)=>[h('div',{class:'m'},l),ins[i]]),sv);
    box.replaceChildren(c1,c2,c3);
  };
  draw();
}

function dev(b){
  const how=h('div',{class:'card'}),box=h('div');
  const nm=h('input',{placeholder:'Contoh: HP Toko'}),
    add=h('button',{class:'wide',onclick:()=>run(add,async()=>{const{error}=await sb.rpc('create_device',{p_name:nm.value.trim()||'HP gateway'});if(error)throw error;nm.value='';say('Perangkat dibuat. Masukkan kodenya di aplikasi HP.');await refresh();draw();})},'Tambah perangkat');
  b.append(h('h1',{},'Perangkat'),how,box,h('div',{class:'card'},h('h2',{},'Tambah HP baru'),h('label',{class:'lb'},'Nama perangkat',nm),add));
  const draw=async()=>{
    const[{data,error},S]=await Promise.all([sb.from('devices').select('*').eq('owner_id',user.id).order('created_at'),cfg()]);
    if(error)return say(error.message,true);
    const on=d=>d.last_seen_at&&Date.now()-new Date(d.last_seen_at)<3*6e4,ok=/^https:\/\//.test(S.apk_url||'');
    how.replaceChildren(h('h2',{},'Cara memasang'),h('ol',{class:'pl'},h('li',{},'Unduh dan pasang aplikasi di HP Android.'),h('li',{},'Buka aplikasi, izinkan SMS dan pengecualian baterai.'),h('li',{},'Masukkan kode pairing dari perangkat di bawah (berlaku 15 menit).')),
      ok?h('a',{href:S.apk_url,rel:'noopener'},h('button',{class:'wide'},'Unduh aplikasi'+(S.apk_version?' (v'+S.apk_version+')':''))):h('p',{class:'warn'},'Link aplikasi belum tersedia.'+(S.support_contact?' Hubungi '+S.support_contact+'.':'')));
    box.replaceChildren(...(data.length?data.map(d=>{const v=d.pair_code&&d.pair_expires_at&&new Date(d.pair_expires_at)>new Date();
      return h('div',{class:'card'},h('div',{class:'row0'},h('b',{},d.name),h('span',{class:'bd '+(on(d)?'ok':'')},on(d)?'Online':d.last_seen_at?'Offline':'Belum terhubung')),
        d.last_seen_at?h('div',{class:'m'},'Terakhir terlihat '+wk(d.last_seen_at)):'',
        v?h('div',{class:'code'},h('span',{},d.pair_code),h('button',{class:'g',onclick:()=>cp(d.pair_code)},'Salin')):'',
        h('button',{class:'g wide',onclick:e=>run(e.target,async()=>{const{error}=await sb.rpc('new_pair_code',{p_device_id:d.id});if(error)throw error;draw();})},v?'Buat kode baru':'Buat kode pairing'));
    }):[h('p',{class:'m'},'Belum ada perangkat. Tambahkan HP pertamamu di bawah.')]));
  };draw();
}

function plan(b){
  const top=h('div'),pl=h('div'),hist=h('div',{class:'card'});b.append(h('h1',{},'Paket'),top,pl,hist);
  const draw=async()=>{
    const[{data:ps},{data:pm},S]=await Promise.all([sb.from('plans').select('*').eq('is_active',true).order('sort_order'),
      sb.from('payments').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(10),cfg()]);
    const pend=(pm||[]).find(x=>x.status==='pending');
    top.replaceChildren(...(pend?[h('section',{class:'card'},h('h2',{},'Selesaikan pembayaran'),h('p',{class:'m'},pend.plan_name+' · transfer sesuai jumlah ini:'),
      h('div',{class:'amt'},h('span',{},rp(pend.amount_idr)),h('button',{class:'g',onclick:()=>cp(String(pend.amount_idr))},'Salin')),
      h('p',{class:'ins'},S.payment_instructions||'Hubungi admin untuk nomor rekening.'),
      h('p',{class:'m'},'Nominal sudah termasuk kode unik agar transfermu mudah dikenali. Paket aktif setelah admin memastikan transfer masuk.'+(S.support_contact?' Bantuan: '+S.support_contact:'')))]:[]));
    pl.replaceChildren(...(ps||[]).map(p=>h('section',{class:'card'},h('h2',{},p.name),h('div',{class:'price'},rp(p.price_idr)),h('p',{class:'m'},p.description||''),
      h('ul',{class:'pl'},h('li',{},p.sms_quota+' SMS'),h('li',{},'Aktif '+p.duration_days+' hari'),h('li',{},p.max_devices+' perangkat · maks. '+p.daily_limit+' SMS per hari')),
      h('button',{class:'wide',onclick:e=>run(e.target,async()=>{const{error}=await sb.rpc('create_order',{p_plan_id:p.id});if(error)throw error;say('Pesanan dibuat. Ikuti petunjuk transfer di atas.');await draw();scrollTo(0,0);})},'Pesan paket'))));
    const L={pending:['Menunggu konfirmasi','m'],paid:['Lunas','ok'],rejected:['Ditolak','er']};
    hist.replaceChildren(h('h2',{},'Riwayat pesanan'),...(pm?.length?pm.map(x=>h('div',{class:'row'},h('div',{},h('b',{},x.plan_name),h('div',{class:'m'},wk(x.created_at))),
      h('div',{class:'rt'},rp(x.amount_idr),h('div',{class:'m '+(L[x.status]||['',''])[1]},(L[x.status]||[x.status])[0])))):[h('p',{class:'m'},'Belum ada pesanan.')]));
  };
  draw().catch(e=>say(e.message,true));
}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')authView();});
start();
</script></body></html>

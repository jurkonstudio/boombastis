<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* header + tab */
.hdr{position:sticky;top:0;z-index:5;background:var(--pn);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:8px;min-height:42px;padding:calc(4px + env(safe-area-inset-top)) 12px 4px}
.ttl{font-weight:700;letter-spacing:.01em;white-space:nowrap}.ttl i{font-style:normal;color:var(--ac)}.ttl span{color:var(--m);font-weight:400}.sp{flex:1}
.ib{white-space:nowrap;min-width:36px;min-height:34px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:none;cursor:pointer;color:var(--m)}.ib:hover{background:var(--hv);color:var(--t)}

.tabs button:hover{color:var(--t)}.tabs .on{color:var(--ac);border-bottom-color:var(--ac);background:var(--inb)}
.nb{display:inline-block;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;line-height:18px;text-align:center}.nb.w{background:var(--wn);color:#111}
.view{max-width:880px;margin:0 auto;padding:10px 12px}

.pn>h2{display:flex;justify-content:space-between;gap:8px;margin:0;padding:8px 12px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--m);border-bottom:1px solid var(--bd)}
.pad{padding:10px 12px}.m{color:var(--m)}.ok{color:var(--ok)}.er{color:var(--er)}.wn{color:var(--wn)}.empty{padding:14px 12px;color:var(--m)}

.tm{flex:none;color:var(--m)}.lg .tx{flex:1;min-width:0;overflow-wrap:anywhere}.lg .la{flex:none;display:flex;gap:6px}
/* akordeon */
.it{border-bottom:1px solid var(--bd)}.it:last-child{border-bottom:0}
.hd{display:grid;grid-template-columns:10px minmax(0,1fr) auto 12px;gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 12px;background:none;border:0;text-align:left;cursor:pointer}.hd:hover{background:var(--hv)}

.tg{display:inline-block;padding:0 7px;border:1px solid currentColor;border-radius:4px;font-size:11px;color:var(--m)}.tg.ok{color:var(--ok)}.tg.er{color:var(--er)}.tg.wn{color:var(--wn)}.tg.ac{color:var(--ac)}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="msg"></div><div id="root"></div>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const ME={email:''};let D=null,tab='log',timer=null,synced=null;

  root.replaceChildren(h('div',{class:'auth'},h('h1',{},h('i',{},'›'),' boombastis / admin'),msg?h('p',{class:'er'},msg):'',h('div',{class:'pn'},h('div',{class:'pad'},h('label',{class:'lb'},'email',em),h('label',{class:'lb'},'password',pw),go)),h('p',{class:'m'},'Halaman ini hanya untuk pemilik layanan.')));

async function boot(){

  const{data,error}=await sb.rpc('my_account');if(error)return login(error.message);

const nameOf=id=>{const u=D.who[id]||{};return u.full_name||u.email||'Pelanggan';};
function S(){
  const now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),1),paid=D.pay.filter(p=>p.status==='paid'),sum=a=>a.reduce((s,p)=>s+p.amount_idr,0),pd=p=>new Date(p.paid_at||p.created_at);
  const months=[...Array(6)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);return{l:d.toLocaleString('id-ID',{month:'short'}),v:sum(paid.filter(p=>pd(p)>=d&&pd(p)<e))};});

  return{now,month:sum(paid.filter(p=>pd(p)>=ms)),total:sum(paid),nPaid:paid.length,months,act,on,pend:D.pay.filter(p=>p.status==='pending'),sent:D.ov.reduce((s,u)=>s+Number(u.sent_30d||0),0)};

/* ---------- kerangka ---------- */
const TABS=[['log','Console'],['pay','Bayar'],['usr','Pelanggan'],['tpl','Template'],['plan','Setelan']];
function tabsEl(){
  const np=D.pay.filter(p=>p.status==='pending').length,nl=logs().filter(x=>x.lv!=='in').length;

    k==='pay'&&np?h('span',{class:'nb'},np):k==='log'&&nl?h('span',{class:'nb w'},nl):'')));
}
function chrome(){const old=$('#hdr');const n=h('header',{class:'hdr',id:'hdr'},h('div',{class:'bar'},h('b',{class:'ttl'},h('i',{},'›'),' boombastis',h('span',{},' / admin')),h('span',{class:'sp'}),
  h('button',{class:'ib',title:'Muat ulang',onclick:e=>run(e.currentTarget,async()=>{await reload();say('Data diperbarui.');})},'↻'),
  h('button',{class:'ib',title:'Keluar',onclick:async()=>{clearInterval(timer);await sb.auth.signOut();login();}},'keluar')),tabsEl());
  if(old)old.replaceWith(n);else root.prepend(n);}
function status(){const s=S(),dv=D.ov.filter(u=>u.device_count>0),b=h('footer',{class:'sb',id:'sb'},h('span',{},'pending ',h('b',{},s.pend.length)),h('span',{},'aktif ',h('b',{},s.act.length+'/'+D.ov.length)),h('span',{},'hp online ',h('b',{},dv.filter(s.on).length+'/'+dv.length)),h('span',{},'sync ',h('b',{},hms(synced))),h('span',{},ME.email));

const go=(k,f)=>{tab=k;if(f)Object.assign(ST,f);chrome();view();scrollTo(0,0);};

/* ---------- console ---------- */
function logs(){

  b.append(h('section',{class:'pn'},h('h2',{},'ringkasan'),h('div',{class:'cells'},cell(rp(s.month),'pendapatan bulan ini'),cell(s.pend.length,'menunggu konfirmasi',s.pend.length>0),cell(s.act.length+'/'+D.ov.length,'pelanggan aktif'),cell(dv.filter(s.on).length+'/'+dv.length,'HP online')),

      (x.go||x.wa)?h('span',{class:'la'},x.go?h('button',{class:'bt sm g',onclick:()=>go(x.go[0],x.go[1])},'buka'):'',x.wa?h('a',{href:x.wa,target:'_blank',rel:'noopener'},h('button',{class:'bt sm g'},'wa')):''):'')):[h('div',{class:'empty'},'(tidak ada log)')]));};
  b.append(h('section',{class:'pn'},h('h2',{},'console'),h('div',{class:'pad'},bar),list));draw();

/* ---------- pembayaran ---------- */
function pay(b){
  const bar=h('div',{class:'chips'}),list=h('div'),q=h('input',{type:'search',placeholder:'filter nama, paket, nominal…',value:ST.pq,oninput:()=>{ST.pq=q.value.toLowerCase();draw();}}),n=k=>D.pay.filter(p=>k==='all'||p.status===k).length;
